<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEED Initiative — Living Campus | OneVibeMediaGroup</title>
<meta name="description" content="A real-time 3D model of the SEED Initiative Living Campus: closed-loop water, on-site generation, carbon capture, community programs, and the watershed corridor that runs from the campus to the Atlantic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a0d; --ink:#eef2f6; --dim:#9aa6b2; --dimmer:#6d7986;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --panel:rgba(12,16,21,.86); --panel2:rgba(18,23,30,.94);
  --accent:#5FD39B; --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- loading ---------- */
#boot{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 90% at 50% 40%,#101821 0%,#05080b 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot h1{margin:0;font-size:clamp(20px,3.4vw,34px);font-weight:600;letter-spacing:-.02em}
#boot .sub{color:var(--dim);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
#bar{width:min(360px,72vw);height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
#bootmsg{color:var(--dimmer);font-size:12px;font-family:var(--mono);height:16px}

/* ---------- chrome ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;padding:14px 16px;pointer-events:none}
#brand{pointer-events:auto;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 14px}
#brand .t{font-size:14px;font-weight:600;letter-spacing:-.01em}
#brand .s{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.05em}
#hud{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.chip{background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:11.5px;color:var(--dim);letter-spacing:.03em;white-space:nowrap;
  transition:background .18s,color .18s,border-color .18s}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{background:rgba(95,211,155,.16);border-color:rgba(95,211,155,.45);color:#dff7ea}

/* ---------- left rail: categories ---------- */
#rail{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;
  background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:10px}
#rail .h{font-size:9.5px;letter-spacing:.18em;color:var(--dimmer);text-transform:uppercase;padding:2px 6px 6px}
.cat{display:flex;align-items:center;gap:9px;background:none;border:0;padding:6px 8px;border-radius:8px;
  font-size:12px;color:var(--dim);text-align:left;width:100%;transition:background .16s,color .16s}
.cat:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.cat .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.cat.off{opacity:.34}
.cat.off .dot{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}

/* ---------- bottom bar: views + time ---------- */
#bottom{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;
  align-items:center;gap:9px;pointer-events:none;width:min(940px,94vw)}
#views{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px}
.view{background:none;border:0;border-radius:999px;padding:7px 14px;font-size:11.5px;color:var(--dim);transition:.16s}
.view:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.view.on{background:rgba(255,255,255,.13);color:var(--ink)}
#timebar{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--panel);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;padding:8px 16px;width:100%;max-width:620px}
#timebar label{font-size:10px;letter-spacing:.14em;color:var(--dimmer);text-transform:uppercase}
#clock{font-family:var(--mono);font-size:12px;color:var(--ink);min-width:52px;text-align:right}
#time{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:linear-gradient(90deg,
  #0d1b2e 0%,#2c3f5c 18%,#c78a4a 27%,#8fb6dd 42%,#a9c9e8 55%,#d98a4e 74%,#3a3450 84%,#0d1b2e 100%);outline:none}
#time::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;
  border:2px solid #0a0d11;cursor:pointer}
#time::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #0a0d11;cursor:pointer}
#presets{display:flex;gap:4px}
#presets button{background:none;border:0;font-size:10.5px;color:var(--dimmer);padding:3px 7px;border-radius:6px}
#presets button:hover{background:rgba(255,255,255,.08);color:var(--ink)}

/* ---------- markers ---------- */
#pins{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:none;border:0;padding:0;
  will-change:transform,opacity}
.pin .ring{width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;
  background:rgba(6,9,12,.62);backdrop-filter:blur(3px);transition:transform .18s,box-shadow .18s}
.pin .ring i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pin:hover .ring,.pin.sel .ring{transform:scale(1.32);box-shadow:0 0 0 5px rgba(255,255,255,.09)}
.pin .lbl{position:absolute;left:26px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;
  color:#e8eef4;background:rgba(6,9,12,.74);border:1px solid var(--line);border-radius:7px;padding:3px 8px;
  opacity:0;transition:opacity .18s;pointer-events:none}
.pin:hover .lbl,.pin.sel .lbl{opacity:1}
.pin.clustered .lbl{display:none}
.cluster{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:rgba(6,9,12,.78);
  border:1px solid var(--line2);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--ink);
  backdrop-filter:blur(4px)}

/* ---------- detail card ---------- */
#card{position:fixed;right:16px;top:50%;transform:translate(120%,-50%);width:min(420px,calc(100vw - 32px));
  max-height:min(78vh,760px);z-index:60;background:var(--panel2);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s;opacity:0}
#card.open{transform:translate(0,-50%);opacity:1}
#card header{padding:18px 18px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
#card .cat{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);padding:0;background:none;width:auto;margin-bottom:8px}
#card h2{margin:0 0 8px;font-size:19px;line-height:1.25;letter-spacing:-.015em;font-weight:600}
#card .kick{margin:0;font-size:13px;line-height:1.55;color:var(--dim)}
#close{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--dim);font-size:15px;line-height:1;display:grid;place-items:center}
#close:hover{color:var(--ink);background:rgba(255,255,255,.11)}
#stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);flex:0 0 auto}
#stats div{background:var(--panel2);padding:12px 14px}
#stats b{display:block;font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:-.02em}
#stats span{display:block;font-size:10.5px;color:var(--dimmer);margin-top:3px;letter-spacing:.04em}
#body{overflow-y:auto;padding:6px 18px 18px;flex:1 1 auto;scrollbar-width:thin}
#body h3{margin:16px 0 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
#body p{margin:0;font-size:13px;line-height:1.62;color:#c9d3dc}
#note{margin-top:16px;padding:12px 13px;border-left:2px solid var(--accent);background:rgba(95,211,155,.07);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.55;color:#cfe6da}
#tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
#tags span{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.todofact{display:inline-block;font-family:var(--mono);font-size:11px;color:#ffb020;border:1px dashed rgba(255,176,32,.55);
  border-radius:6px;padding:2px 7px;margin:2px 0}

/* ---------- misc ---------- */
#hint{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);z-index:35;font-size:11px;color:var(--dimmer);
  background:rgba(6,9,12,.6);border:1px solid var(--line);border-radius:999px;padding:5px 13px;
  transition:opacity .5s;pointer-events:none}
#hint.gone{opacity:0}
#dbg{position:fixed;left:16px;top:16px;z-index:70;font-family:var(--mono);font-size:11px;line-height:1.55;
  background:rgba(4,6,9,.9);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:#a8ffcf;
  white-space:pre;display:none;max-height:80vh;overflow:auto}
#dbg.on{display:block}
#a11y{position:fixed;inset:0;z-index:150;background:#070a0d;overflow-y:auto;padding:40px 24px;display:none}
#a11y.on{display:block}
#a11y .wrap{max-width:760px;margin:0 auto}
#a11y h1{font-size:24px;margin:0 0 6px}
#a11y h2{font-size:16px;margin:32px 0 4px;color:var(--accent)}
#a11y h3{font-size:13px;margin:18px 0 2px}
#a11y p{font-size:13.5px;line-height:1.65;color:#c2ccd6;margin:6px 0}
#a11y .st{font-family:var(--mono);font-size:12px;color:var(--dim)}
@media (max-width:820px){
  #rail{left:8px;padding:7px;gap:3px}
  .cat{font-size:11px;padding:5px 6px}
  .cat span.nm{display:none}
  #card{right:8px;left:8px;width:auto;bottom:96px;top:auto;transform:translateY(120%);max-height:58vh}
  #card.open{transform:translateY(0)}
  #brand .s{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.06s!important}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="boot" role="status" aria-live="polite">
  <div class="sub">OneVibeMediaGroup</div>
  <h1>SEED Initiative — Living Campus</h1>
  <div id="bar"><i></i></div>
  <div id="bootmsg">starting</div>
</div>

<div id="top">
  <div id="brand">
    <div class="t">SEED Initiative — Living Campus</div>
    <div class="s">Bennettsville, South Carolina · v4</div>
  </div>
  <div id="hud">
    <button class="chip" id="qBtn" title="Rendering quality">Quality: —</button>
    <button class="chip" id="tourBtn" title="Cinematic tour of all zones">▶ Tour</button>
    <button class="chip" id="labelBtn" title="Show or hide marker labels">Labels</button>
    <button class="chip" id="textBtn" title="Text-only version of every system">Text view</button>
  </div>
</div>

<nav id="rail" aria-label="System categories"><div class="h">Systems</div></nav>

<div id="bottom">
  <div id="timebar">
    <label for="time">Time</label>
    <input id="time" type="range" min="0" max="24" step="0.05" value="14.2" aria-label="Time of day">
    <output id="clock">14:12</output>
    <div id="presets">
      <button data-h="6.2">Dawn</button><button data-h="8.0">Morning</button>
      <button data-h="13.0">Midday</button><button data-h="19.1">Golden</button>
      <button data-h="20.3">Dusk</button><button data-h="22.5">Night</button>
    </div>
  </div>
  <div id="views" role="tablist" aria-label="Camera views"></div>
</div>

<div id="pins" aria-hidden="true"></div>
<div id="hint">Drag to orbit · scroll to zoom · click a marker</div>

<aside id="card" role="dialog" aria-modal="false" aria-labelledby="cardTitle" tabindex="-1">
  <button id="close" aria-label="Close">✕</button>
  <header>
    <div class="cat" id="cardCat"></div>
    <h2 id="cardTitle"></h2>
    <p class="kick" id="cardKick"></p>
  </header>
  <div id="stats"></div>
  <div id="body">
    <div id="rows"></div>
    <div id="note"></div>
    <div id="tags"></div>
  </div>
</aside>

<pre id="dbg"></pre>
<div id="a11y"><div class="wrap"></div></div>

 percent of droplets. Blowdown is treated on site and fed to the cistern rather than discharged."],["Condensate","Data hall HVAC produces 5,000 to 15,000 gallons per day of condensate in this climate. All of it is captured, filtered and routed to the greenhouse top off line."],["Waste heat","Reject heat from the compute halls is piped to the greenhouse and aquaponics buildings instead of being dumped to atmosphere."],["Make up","Rainwater harvesting and condensate cover routine make up. Municipal draw is the backup, not the baseline."]],note:"A conventional campus of this size can consume millions of gallons a year. This one is designed to run at near zero net draw.",tags:["closed loop","waste heat","condensate capture"]},{id:"w2",cat:"water",t:"500,000 gallon cistern",k:"The reservoir that makes the loop possible. Rain, condensate and treated blowdown all land here.",p:[104,14,-58],stem:14,stats:[["500K","gallon capacity"],["218M","gal/yr rainfall on site"],["21.8M","gal/yr at 10% capture"],["~0","discharge to environment"]],rows:[["Inputs","Every roof on the campus drains here. HVAC condensate, cooling tower blowdown and greenhouse runoff all feed the same tank."],["Outputs","Irrigation, toilet flushing, greenhouse top off, wash pack, and fire suppression reserve."],["Resilience","The cistern doubles as an emergency water reserve for the campus and the community during grid or utility interruptions."],["Treatment","Multi stage filtration and UV before any reuse that touches food production."]],tags:["rainwater","reuse","resilience"]},{id:"w3",cat:"water",t:"Berm valley and bioswale belt",k:"The sound berm and the stormwater system are the same piece of earth doing two jobs.",p:[-296,10,150],stem:10,stats:[["0","net runoff increase"],["5 ac","bioswale belt"],["30 ft","berm setback"],["100%","light rain infiltrated"]],rows:[["The move","The perimeter berm is set back 30 feet from the fence, and that gap becomes a grass valley. It channels stormwater to the bioswale ends and fills as a linear detention pond during a storm."],["Bioswales","Five acres of native grasses, wildflowers and river cobble check dams along the road frontage. Light rain events infiltrate completely."],["Paving","Parking, walkways and the event plaza are permeable interlocking concrete pavers. Infiltration runs 100 to 600 inches per hour and recharges the local aquifer."],["Target","Zero net increase in runoff compared to the pre development condition. All rainfall is managed on site."]],note:"One earthwork, three outcomes: sound attenuation, stormwater control and habitat.",tags:["stormwater","permeable paving","dual purpose"]},{id:"w4",cat:"water",t:"Detention pond wetlands",k:"Engineered as habitat first, retention second.",p:[206,4,206],stem:4,stats:[["3","ponds"],["1.5 ac","total surface"],["100 yr","storm capacity"],["0","fishing zones"]],rows:[["Design","Three ponds sized for a 100 year storm, lined with bentonite clay so groundwater recharge still happens."],["Habitat","Native emergent plants including cattail and bulrush, shallow wildlife shelves at the pond edges, and no fishing buffer zones. Frog, turtle and waterfowl habitat by design."],["Public access","A walking path skirts the northern edge with interpretive signage. School tour groups stop here."]],tags:["wetland","habitat","100 year storm"]},{id:"w5",cat:"water",t:"Greenhouse and aquaponics loop",k:"Recirculating growing uses 90 to 95 percent less water than soil farming.",p:[62,12,34],stem:12,stats:[["90 to 95%","less water used"],["~1%","daily loss"],["0","antibiotics"],["4","growing systems"]],rows:[["Hydroponics","Nutrient film channels recirculate solution continuously. The only real loss is plant transpiration, roughly one percent a day."],["Aquaponics","Fish tanks feed a biofilter, the biofilter feeds the plant rafts, the water returns to the fish. A true closed loop with no nutrient discharge."],["Top off","Transpiration losses are replaced with captured HVAC condensate and harvested rainwater, not municipal water."],["Water quality","Continuous monitoring on dissolved oxygen, pH, ammonia and nitrate. Live on the public dashboard."]],tags:["aquaponics","hydroponics","recirculating"]},{id:"e1",cat:"energy",t:"Rooftop solar",k:"Every square foot of roof on this campus is generating.",p:[-60,24,-218],stem:24,stats:[["~40 MW","rooftop DC"],["Bifacial","monocrystalline"],["4.5","peak sun hours/day"],["Cool roof","SR 0.65 or better"]],rows:[["Array","Bifacial monocrystalline panels across all data hall roofs, mounted over a white cool roof membrane so reflected light is captured on the back face."],["Heat island","The same white membrane keeps roof surface temperatures down, which cuts the cooling load underneath and reduces the local heat island effect."],["Structural","Roof structures are designed for the array from day one rather than retrofitted, so no penetration patching or load derating later."]],tags:["bifacial","cool roof","rooftop PV"]},{id:"e2",cat:"energy",t:"Agrivoltaic ground array",k:"Panels raised eight feet so the land underneath keeps working.",p:[-268,12,60],stem:12,stats:[["~15 MW","ground mount"],["8 ft","clearance"],["Pollinator","understory"],["0","pesticides"]],rows:[["Layout","Elevated racking along the southern and western property lines with native grasses and pollinator plantings underneath rather than gravel or bare ground."],["Why elevated","Eight feet of clearance lets mowing equipment, sheep grazing and pollinator habitat coexist with generation. The land does two jobs."],["Habitat value","The understory strip connects to the wildlife corridor, so the array is part of the habitat network rather than a break in it."]],tags:["agrivoltaic","pollinator","dual use land"]},{id:"e3",cat:"energy",t:"Carport solar and EV charging",k:"Shade for the cars, power for the campus, chargers for everyone.",p:[248,10,66],stem:10,stats:[["8 to 12 MW","carport DC"],["Public","charger access"],["Shade","plus generation"],["Permeable","paving below"]],rows:[["Structure","Canopy solar over all surface parking. Dual purpose from the first day: shade the vehicles, generate the power."],["Charging","EV chargers integrated into the canopy columns. A share of the stalls are open to the public and to community event traffic, not just staff."],["Fleet","Electric yard trucks and the microtransit shuttle fleet charge here overnight off stored solar."]],tags:["carport PV","EV charging","public access"]},{id:"e4",cat:"energy",t:"Battery energy storage",k:"The campus can run its community half without the grid.",p:[250,10,-150],stem:10,stats:[["8 hr","community zone runtime"],["LiFePO4","chemistry"],["Peak","solar absorption"],["Backup","water plant power"]],rows:[["Sizing","Grid scale lithium iron phosphate storage sized to carry the community zone, the greenhouses and the waste to energy plant for eight hours with no grid."],["Peak absorption","Absorbs midday solar output that would otherwise be curtailed, then discharges into the evening ramp."],["Community role","During a regional outage the storage keeps the water treatment plant, the community center and the cold storage running. The campus becomes the neighborhood resilience hub."]],note:"Chemistry choice matters. LiFePO4 is selected over NMC for thermal stability and a longer cycle life, not for cost.",tags:["BESS","LiFePO4","resilience hub"]},{id:"e5",cat:"energy",t:"Waste to energy plant",k:"The only program on this campus that funds itself and then some.",p:[-240,30,-84],stem:30,stats:[["100","tons per day"],["~80%","county waste diverted"],["2 to 3 MW","continuous output"],["+$2.56M","net per year"]],rows:[["Technology","Municipal solid waste gasification. Low oxygen thermal decomposition produces syngas which is converted to electricity. Lower NOx, SOx and particulate output than incineration."],["Diversion","At 100 tons per day the plant diverts roughly 80 percent of county waste from the landfill."],["Economics","Tipping fees at roughly 2.0 million per year, avoided and sold energy at roughly 1.1 million, carbon credits at roughly 456 thousand, against operating cost near 999 thousand."],["Emissions","Secondary combustion chamber at 950 to 1100 C destroys dioxins. Dry sorbent injection for acid gas and a fabric filter for particulates."]],note:"Landfill methane avoided is the quiet win. Every ton diverted prevents roughly half a ton of CO2 equivalent.",tags:["gasification","landfill diversion","self funding"]},{id:"e6",cat:"energy",t:"Substation and microgrid",k:"Islandable by design, and a good neighbor on the grid.",p:[262,20,-252],stem:20,stats:[["15 yr","power purchase agreement"],["10 to 15%","local rate reduction target"],["Islandable","community zone"],["V2I","freight signal priority"]],rows:[["Interconnection","Utility scale interconnection with a fifteen year power purchase agreement that gives the utility long term planning certainty in exchange for grid stability cooperation."],["Export","Surplus generation is exported during peak demand rather than curtailed. Virtual net metering credits flow to enrolled low income households within two miles."],["Islanding","The community zone, greenhouses and water plant can separate from the grid and run on solar plus storage during an outage."]],tags:["microgrid","PPA","virtual net metering"]},{id:"c1",cat:"carbon",t:"Carbon capture on exhaust",k:"Not carbon neutral. Carbon negative.",p:[-240,72,-104],stem:20,stats:[["2 to 5K","tons CO2e removed/yr"],["$25 to 50","per ton credit value"],["DAC","on stack"],["Permanent","sequestration"]],rows:[["Capture","Direct air capture units mounted on the exhaust stacks. Captured CO2 is liquefied and piped to an on site sequestration material partner rather than trucked away."],["Verification","Two to five thousand tons of verified CO2 equivalent removal per year, third party audited. At 25 to 50 dollars per ton that is an additional revenue line, not just a cost."],["The standard","Neutral means you stopped making it worse. Negative means you are pulling more out than you put in. This campus is designed for the second one."]],note:"The claim is only worth what the verification is worth. Every ton is third party measured and published.",tags:["direct air capture","verified removal","carbon negative"]},{id:"c2",cat:"carbon",t:"Biochar production",k:"Organic waste becomes stable carbon locked in the soil for a thousand years.",p:[-198,10,-52],stem:10,stats:[["1,000+","years stable"],["Soil","and growing media"],["Pyrolysis","module"],["On site","use only"]],rows:[["Process","A pyrolysis module attached to the waste to energy line converts the organic fraction into biochar instead of sending it through the gasifier."],["Use","The biochar is mixed into campus landscaping soil and greenhouse growing media. It improves water retention and nutrient holding while storing carbon in a stable form."],["Permanence","Biochar carbon stays put for over a thousand years, which is the difference between an offset and an actual removal."]],tags:["pyrolysis","soil carbon","permanence"]},{id:"c3",cat:"carbon",t:"Carbon sequestering interiors",k:"The building materials themselves are storage.",p:[60,22,-218],stem:22,stats:[["50 to 75","years CO2 stored"],["Mass timber","structure and panels"],["Hempcrete","wall fill"],["Mycelium","composite panels"]],rows:[["Materials","Interior furniture, desks, cabinets, wall panels and flooring use carbon sequestering materials. Biochar enhanced concrete, mass timber, hempcrete wall fill and mycelium composite panels."],["Math","Every ton of these materials represents permanent CO2 stored for fifty to seventy five years, on top of the emissions avoided by not using conventional alternatives."],["Sourcing","Regional suppliers wherever available, which shortens the haul and keeps the spend in the local economy."]],tags:["mass timber","hempcrete","embodied carbon"]},{id:"c4",cat:"carbon",t:"Tree planting and native species",k:"Five thousand trees on site. Fifty thousand more off site.",p:[-120,14,244],stem:14,stats:[["5,000","trees on site"],["50,000","trees off site"],["48 lbs","CO2 per tree per year"],["~42","trees per ton offset"]],rows:[["On site","Five thousand trees across the campus, roughly 120 tons of CO2 absorbed per year at maturity, all sourced from in state nurseries."],["Off site","A fifty thousand tree reforestation partnership beyond the property line, because the carbon math does not care where the tree stands."],["Species","Loblolly pine, Eastern red cedar, tulip poplar, white oak, river birch, sweetgum and black walnut. Native only."],["Canopy","A forty percent canopy cover target over all hardscaped areas within ten years."]],tags:["native species","reforestation","canopy target"]},{id:"c5",cat:"carbon",t:"Wildlife corridor",k:"Forty acres kept continuous so animals can still cross.",p:[-40,10,268],stem:10,stats:[["40 ac","green zone"],["Unlit","eastern night zone"],["50 to 90%","bird strike reduction"],["2 ac","pollinator meadow"]],rows:[["Corridor","The community green zone is designed as one continuous wildlife corridor rather than a set of disconnected patches. Native meadow strips run between the tree rows."],["Dark sky","The eastern side stays unlit at night for nocturnal movement. All exterior lighting elsewhere is warm spectrum 2700K, downward facing and full cutoff."],["Bird safety","All building glass uses UV pattern fritted glass. It is invisible to people and visible to birds, and cuts strike mortality by 50 to 90 percent."],["Baseline","A full ecological survey of birds, pollinators, amphibians and mammals is completed and published before any ground is broken."]],note:"The pre construction survey is the honest part. You cannot claim you protected something you never counted.",tags:["dark sky","bird safe glass","pre construction survey"]},{id:"a1",cat:"air",t:"Emissions control and monitoring",k:"Continuous, public, and audited by someone who does not work here.",p:[-278,52,-104],stem:20,stats:[["80 to 90%","NOx reduction"],["CEMS","continuous monitoring"],["Below","EPA MACT standards"],["Annual","third party audit"]],rows:[["Turbines","Selective catalytic reduction on all exhausts cuts NOx by 80 to 90 percent. A continuous emissions monitoring system runs at all times."],["Waste to energy","Secondary combustion at 950 to 1100 C, dry sorbent injection for acid gas and a fabric filter for particulates. All streams run below EPA MACT standards."],["Publication","Emissions data is streamed to the public dashboard, not filed in a drawer. Third party annual audit."]],tags:["SCR","CEMS","public data"]},{id:"a2",cat:"air",t:"Public air sensor network",k:"Twelve sensors. Eight of them are not on our property.",p:[176,20,132],stem:20,stats:[["12","sensors total"],["8","in the community"],["7","pollutants tracked"],["Live","public dashboard"]],rows:[["Placement","Four sensors on the site perimeter and eight in community locations including schools, homes, the park and a church. The community sites are the ones that matter."],["Measured","PM2.5, PM10, NOx, SOx, CO, VOC and ozone."],["Access","Live public dashboard with no login and no filtering. If a reading goes the wrong way, the neighbors see it at the same moment we do."]],note:"Monitoring you control and publish is a commitment. Monitoring you control and hide is a liability.",tags:["PM2.5","community sited","open data"]},{id:"a3",cat:"air",t:"Living green walls",k:"The turbine enclosures are covered in plants that filter the air at the wall face.",p:[-196,20,-118],stem:20,stats:[["20 to 40%","PM2.5 cut at wall"],["Native","climbing species"],["Visual","screening"],["Thermal","buffer"]],rows:[["Species","Virginia creeper, climbing hydrangea and native vines on the exterior of the turbine enclosures."],["Effect","Study backed particulate reduction of 20 to 40 percent measured at the wall surface, plus a thermal buffer that reduces enclosure cooling load."],["Appearance","The industrial buildings read as green mass from the road rather than as bare metal boxes. That matters to the people who look at it every day."]],tags:["biofiltration","screening","native vines"]},{id:"a4",cat:"air",t:"Odor control and no idling",k:"The waste hall is held at negative pressure so nothing escapes the tipping floor.",p:[-282,12,-46],stem:12,stats:[["Negative","hall pressure"],["Biofilter","before release"],["200 ft","no idling boundary"],["Electric","yard trucks"]],rows:[["Containment","The waste receiving hall runs at negative pressure. Air is pulled through a biofilter before release, so no odor escapes the tipping floor."],["Traffic","All delivery trucks shut off within 200 feet of the community zone. Internal movement is handled by electric yard trucks."],["Routing","Waste haulers use a dedicated haul road that never touches the community entrance or a residential street."]],tags:["negative pressure","biofilter","electric fleet"]},{id:"s1",cat:"sound",t:"Six layer attenuation stack",k:"Sound is treated as a design constraint, not a complaint to manage later.",p:[300,16,-40],stem:16,stats:[["6","layers of control"],["4,000 LF","perimeter wall"],["15 to 20 ft","wall height"],["-25 to -40 dB","internal roof panels"]],rows:[["L1 louvers","Acoustic louvers on all turbine and HVAC inlets. Minus 15 to 25 dB."],["L2 blankets","Mass loaded vinyl on generators. STC 32 to 35."],["L3 wall","A mass loaded vinyl perimeter wall, 15 to 20 feet tall and 4,000 linear feet. Minus 20 to 30 dB."],["L4 berm","A 15 foot sloped earth berm planted with native evergreens. Minus 5 to 15 dB, and it holds the stormwater valley."],["L5 asphalt","Rubberized asphalt on every interior road. Tire noise down 6 to 10 dB."],["L6 roof","Mass loaded vinyl and mineral wool in all building roofs. Minus 25 to 40 dB of internal noise."]],note:"Layers compound. No single measure gets you there, and no single measure fails alone.",tags:["acoustic louvers","MLV wall","berm"]},{id:"s2",cat:"sound",t:"Infrasound monitoring array",k:"No data center on earth publicly monitors infrasound. This one does, before the first turbine fires.",p:[-300,26,-40],stem:26,stats:[["1 to 20 Hz","infrasound band"],["12","sensors deployed"],["8","in the community"],["6 mo","pre construction baseline"]],rows:[["The gap","Infrasound in the 1 to 20 Hz band is below normal hearing but is the frequency people report as pressure, hum or sleep disruption. Nobody in this industry publishes it."],["Array","Twelve sensors. Four on site and eight in the community at schools, homes, the park and a church. All data streamed publicly."],["Baseline","A six month pre construction baseline is recorded before anything is built. That baseline is what makes every later measurement meaningful."],["Cost","196,000 dollars to install and 28,000 dollars a year to monitor. It is not the expensive part of this project."]],note:"The baseline protects the community and the project at the same time. You cannot argue about a number you both watched get recorded.",tags:["world first","1 to 20 Hz","public baseline"]},{id:"s3",cat:"sound",t:"Neighbor window program",k:"If the modeling says a home might notice it, we pay for the windows.",p:[-236,10,392],stem:10,stats:[["$2,000","rebate per home"],["0.5 mi","radius"],["~100","homes covered"],["$200K","program budget"]],rows:[["Offer","A 2,000 dollar rebate toward triple pane window upgrades for any home within a half mile radius. Roughly 100 homes at a 200 thousand dollar budget."],["No argument required","The rebate is not conditional on proving a noise complaint. It is offered up front to everyone in the radius."],["Side benefit","Triple pane glazing also cuts those households heating and cooling bills, permanently."]],tags:["neighbor rebate","triple pane","no proof required"]},{id:"s4",cat:"sound",t:"Rubberized interior roads",k:"Recycled tire rubber in the asphalt, quieter surface, longer life.",p:[140,6,-20],stem:6,stats:[["-6 to -10 dB","tire noise"],["Recycled","tire crumb"],["All","interior roads"],["Longer","service life"]],rows:[["Surface","Every interior road on the campus uses rubberized asphalt. Tire noise drops 6 to 10 dB compared to conventional pavement."],["Material","The rubber comes from recycled tires, which is a waste stream diverted and a quieter road at the same time."],["Maintenance","Rubberized surfaces resist cracking and rutting, so the resurfacing interval stretches out and the lifetime cost drops."]],tags:["rubberized asphalt","recycled tires"]},{id:"i1",cat:"infra",t:"Compute halls",k:"The reason the rest of it can be paid for.",p:[-180,24,-218],stem:24,stats:[["4","hall structures"],["Phased","delivery"],["Cool roof","plus rooftop PV"],["Waste heat","recovered"]],rows:[["Structure","Four hall structures built in phases so capital is matched to contracted demand rather than speculation."],["Envelope","Mass loaded vinyl and mineral wool in the roof assembly, UV fritted glass, white cool roof membrane under the solar array."],["Heat","Reject heat is a resource here. It is piped to the greenhouse and aquaponics buildings instead of being rejected to atmosphere."],["Revenue","A defined share of operating revenue is committed to the community programs on this campus by written agreement, not by press release."]],note:"The compute is the engine. Everything else on this map is what the engine is for.",tags:["phased build","waste heat recovery","revenue share"]},{id:"i2",cat:"infra",t:"Fiber and network spine",k:"Redundant paths in, and capacity left for the community on the way out.",p:[120,16,-140],stem:16,stats:[["Diverse","entry paths"],["Conduit","sized for growth"],["Community","broadband pull through"],["150","public wifi nodes"]],rows:[["Redundancy","Diverse physical entry paths so a single backhoe cannot take the site down."],["Community capacity","Every conduit run beyond the fence is sized for a future broadband pull through. When the trench is already open, the marginal cost of leaving room is close to zero."],["Public wifi","A 150 node public wifi mesh across the community zone and the adjacent neighborhoods."]],tags:["diverse routing","spare conduit","public wifi"]},{id:"i3",cat:"infra",t:"Separated haul and access roads",k:"Waste trucks and school buses never meet.",p:[-160,8,-140],stem:8,stats:[["Dedicated","waste haul road"],["Separate","community entrance"],["Electric","yard fleet"],["0","truck routes through housing"]],rows:[["Separation","The waste to energy haul road has its own ingress and egress with a dedicated truck turnaround. It never crosses the community entrance."],["Community entrance","The plaza, greenhouse and community center entrance is on the opposite side of the campus from all industrial traffic."],["Bypass","Industrial loop roads keep heavy traffic out of residential streets entirely, and freight signal priority moves trucks through off peak."]],tags:["traffic separation","haul road","loop road"]},{id:"i4",cat:"infra",t:"Perimeter, security and access",k:"A working fence line that still lets the public in where it should.",p:[300,14,140],stem:14,stats:[["24/7","security across zones"],["Public","community zone access"],["QR","event registration"],["0","personal data sold"]],rows:[["Zoning","Industrial and community zones are separately secured. The community half is genuinely open, the compute half is genuinely controlled."],["Events","Free online registration produces a QR code scanned at entry. Capacity caps by event type. No personal data is ever sold or shared."],["Tours","Free 45 minute guided tours on Saturdays with a maximum of 25 people per tour, plus school groups on request midweek."]],tags:["zoned security","open access","tours"]},{id:"m1",cat:"comm",t:"Community center",k:"The building that has nothing to do with data and everything to do with why this works.",p:[-82,22,172],stem:22,stats:[["Free","to use"],["7 days","open"],["4","third places inside"],["0","purchase required"]],rows:[["Third places","Ray Oldenburg made the case that people need somewhere that is not home and not work. This building holds four of them: a one dollar coffee house, a maker space, a teen drop in center and a senior gathering hall."],["Maker space","3D printers, sewing machines, woodworking tools and soldering stations. Free to use after a thirty minute orientation, with weekly classes taught by community members."],["Teen center","After school space for ages 12 to 18. Snacks, homework help, a music studio and staff who know their names."],["Seniors","Daily programming, weekly meals and health screenings. Paired with the senior connection visiting program."],["Services","A library branch, free legal aid clinic hours, notary, voter registration, and a cooling and warming center during extreme weather."]],note:"No purchase required to sit here all day. That is the entire point of a third place.",tags:["third place","maker space","library","legal aid"]},{id:"m2",cat:"comm",t:"Event plaza and stage",k:"Three acres built as a permanent venue, not a parking lot with a rented tent.",p:[64,14,182],stem:14,stats:[["3 ac","permeable plaza"],["20x40 ft","permanent stage"],["400A","stage service"],["$0","rental equipment"]],rows:[["Surface","Three acres of permeable interlocking pavers with flush power pedestals every thirty feet. Daily parking, event venue on demand."],["Stage","A permanent reinforced concrete stage pad with 400 amp service, rigging anchor points and a backstage utility room. Nothing gets rented in."],["Acoustics","Two permanent twelve foot wing walls flank the stage. They work as acoustic reflectors for the audience and as sound baffles facing the road."],["Restrooms","A permanent eight stall plus two ADA restroom building that doubles as the security office. No portable toilets, ever."],["Calendar","Weekly farm stand, monthly block party, quarterly community fair at 1,500 to 2,000 people, an annual SEED Day open house, and a summer Friday night market."]],tags:["permanent venue","farm stand","night market"]},{id:"m3",cat:"comm",t:"Greenhouse network",k:"Four houses, roughly 390,000 pounds of food a year, heated by the compute halls.",p:[-116,16,26],stem:16,stats:[["53,000 sq ft","under glass"],["~390K lbs","produce per year"],["~875","people fed on produce"],["Waste heat","primary heating"]],rows:[["GH1 greens","20,000 square feet of nutrient film hydroponic rails. Lettuce, spinach, kale, basil and microgreens at roughly 150,000 pounds a year."],["GH2 fruiting","15,000 square feet of Dutch bucket drip. Tomatoes, cucumbers, peppers and strawberries at roughly 120,000 pounds a year."],["GH3 mushrooms","8,000 square feet of substrate growing rooms. Oyster, shiitake and lion mane at roughly 40,000 pounds a year."],["GH4 roots","10,000 square feet of deep water culture and vertical towers. Sweet potato, beets, radish and carrots at roughly 80,000 pounds a year."],["Distribution","School district vegetable supply first, then the Saturday farm stand at below retail, then the community fridges."]],note:"The heat that a normal data center throws away grows this food.",tags:["controlled environment","school meals","waste heat"]},{id:"m4",cat:"comm",t:"Aquaponics and marine showcase",k:"Fish, shrimp, and a 5,000 gallon reef tank that school groups will remember for life.",p:[54,16,66],stem:16,stats:[["20,000 sq ft","recirculating system"],["~25K lbs","fish per year"],["~8K lbs","shrimp per year"],["0","antibiotics"]],rows:[["Production","A 20,000 square foot recirculating aquaculture system growing tilapia, Pacific white shrimp and freshwater prawns."],["Quality","Zero antibiotics, clean water and low stress handling. Sushi grade certification is achievable, which changes the price the product commands."],["Showcase","A 5,000 gallon display tank visible from the public walking path with marine fish, corals, live rock and plankton cultures. It is the educational centerpiece."],["Loop","Fish waste feeds the biofilter, the biofilter feeds the plant rafts in the greenhouses, and the water returns clean."]],tags:["RAS","sushi grade","education"]},{id:"m5",cat:"comm",t:"Food hub and community kitchen",k:"A commercial kitchen rented by the hour launches food businesses that could never afford one.",p:[158,14,44],stem:14,stats:[["$10 to 25","per hour"],["First 20 hrs","free for new businesses"],["1,000+","emergency meals per day"],["Sat 8am","farm stand"]],rows:[["Kitchen","Commercial ranges, convection ovens, walk in cooler and freezer, prep tables and dish station, licensed for retail food production."],["Access","Ten to twenty five dollars an hour on a sliding scale, and the first twenty hours are free for a new business. Graduates get priority booking at the block party food carts."],["Wash pack","Cold storage and a wash pack line for greenhouse output, plus the farm stand structure that runs every Saturday from 8am to 1pm."],["Emergency","The kitchen converts to a hot meal hub during a disaster and can produce over a thousand meals a day for a week or more."]],tags:["commercial kitchen","food entrepreneurs","emergency hub"]},{id:"k1",cat:"work",t:"Trades and vocational academy",k:"Every system on this campus is also a classroom. You do not import the workforce, you build it.",p:[-222,20,164],stem:20,stats:[["16","training tracks"],["Earn","while you learn"],["Guaranteed","interview on completion"],["$10M/yr","scholarship fund"]],rows:[["Building trades","Plumbing and pipefitting, electrical, HVAC and refrigeration, welding and metal fabrication, carpentry and finish work, masonry and concrete."],["Grounds and green","Landscaping and grounds maintenance, arboriculture and tree care, native habitat restoration, irrigation systems, and horticulture."],["Growing","Controlled environment agriculture, hydroponic and aquaponic systems technician, greenhouse climate controls, and food safety certification."],["Energy","Solar PV installation toward NABCEP certification, battery storage technician, substation and high voltage safety, and generator and turbine maintenance."],["Water","Water and wastewater treatment operator certification, reverse osmosis systems, and closed loop water quality monitoring."],["Technical","Critical facility and data center operations, fiber optic splicing and low voltage, building automation controls, environmental monitoring technician, and industrial instrumentation."],["Logistics","Commercial driver licensing, heavy equipment operation, warehouse and inventory systems, and forklift and rigging certification."],["Service","Culinary and food service, facilities and janitorial supervision, security and life safety, and customer facing operations."]],note:"The trades on this list are not a token gesture. Landscaping, plumbing and grounds work are the jobs this campus needs most and hires for longest.",tags:["16 tracks","plumbing","landscaping","electrical","HVAC","water treatment","CDL"]},{id:"k2",cat:"work",t:"Apprenticeship pipeline",k:"Paid from day one, credentialed at the end, hired if you want the job.",p:[-256,12,120],stem:12,stats:[["Paid","from week one"],["0","tuition cost"],["Tools","and transport covered"],["Local","hire priority"]],rows:[["Structure","Registered apprenticeship model. Classroom hours at the academy, paid field hours on the live campus, and a portable credential at the end that works anywhere."],["Barriers removed","Tuition, tools, transportation and a living stipend during training are all covered. Childcare is on the campus and costs 2 to 5 dollars a day."],["Priority","Local residents first, then Dignity Village and re entry program graduates, then the wider region. Employers on campus commit to hiring minimums in writing."],["Wage floor","A wage uplift grant matches employers who raise pay scales above the county baseline, which pulls the local wage floor up rather than holding it down."]],note:"A credential nobody hired you for is a receipt. The interview at the end is the part that matters.",tags:["registered apprenticeship","no tuition","local hire"]},{id:"k3",cat:"work",t:"Field training yard",k:"Where the pipe actually gets threaded and the sod actually gets laid.",p:[-176,10,206],stem:10,stats:[["Live","systems training"],["Mock ups","plumbing and electrical"],["Nursery","for site planting"],["Year round","operation"]],rows:[["Wet trades","Full scale plumbing and pipefitting mock up bays. Trainees cut, thread, solder and pressure test on real assemblies before they touch a live building."],["Grounds","An on site nursery and landscape yard. Trainees propagate the native stock that gets planted across the campus and along the community streets."],["Heavy","A graded practice pad for equipment operation, grading, trenching and rigging under supervision."],["Automation","Local workers are trained to monitor, program and maintain the automated systems rather than being replaced by them. Higher wage than the job it replaced."]],tags:["hands on","nursery","equipment pad","automation ready"]},{id:"b1",cat:"beyond",t:"Road upgrades and smart signals",k:"The road in front of your house gets fixed whether or not you ever set foot on this campus.",p:[-60,14,384],stem:14,stats:[["20","intersections"],["$120 to 180K","per intersection"],["Preemption","for emergency vehicles"],["USDOT","RAISE grant funded"]],rows:[["Adaptive control","Radar and video analytics at every approach with real time vehicle, bike and pedestrian counting. Signal timing adjusts every cycle instead of running a fixed plan from 1998."],["Emergency","Every signal is hard wired for emergency vehicle preemption. A fire truck or ambulance within a half mile clears every light on its route automatically."],["Crossings","Rapid flashing beacons, audible pedestrian signals and countdown timers at every crosswalk. Curb ramps rebuilt to current ADA standard."],["Funding","USDOT RAISE, FHWA signal timing improvement and NC DOT safety programs carry most of the capital. Annual software and maintenance runs about 80 thousand."]],tags:["adaptive signals","emergency preemption","ADA ramps"]},{id:"b2",cat:"beyond",t:"ADA sidewalk network",k:"Workers here walk in the road shoulder to reach a bus stop. That is solvable.",p:[110,10,392],stem:10,stats:[["15 mi","phase one"],["40 mi","full build"],["5 ft","minimum ADA width"],["30 yr","concrete life"]],rows:[["The problem","Low and medium income housing in this region typically has zero sidewalk access. People walk in the shoulder to reach transit. It is dangerous and it is completely fixable."],["Priority order","Housing to the nearest bus stop first, then housing to a grocery store, then housing to this campus, then K through 12 school routes."],["Standard","Five foot minimum ADA compliant concrete with detectable warning strips at every curb cut. Thirty year life against ten for asphalt."],["Funding","USDOT Safe Streets and Roads for All, HUD CDBG and NC DOT programs. Phase one is fifteen miles."]],note:"Every other program on this list is harder to reach if you cannot safely walk there.",tags:["15 miles phase one","transit access","school routes"]},{id:"b3",cat:"beyond",t:"Solar street lighting",k:"450 poles with no utility bill, ever, and they stay on when the grid does not.",p:[214,16,378],stem:16,stats:[["450","pole units"],["3+ days","battery autonomy"],["$0","utility cost"],["$40.5K/yr","municipal savings"]],rows:[["System","Off grid solar LED units with lithium iron phosphate batteries carrying three or more cloudy days. Warm spectrum, downward facing, full cutoff fixtures."],["Coverage","300 new poles on currently unlit residential streets plus 150 replacements on priority pedestrian routes."],["Resilience","They keep working during a grid outage, which turns lit streets into a public safety asset exactly when it matters most."],["Municipal effect","The town pays nothing to run them. That is roughly 40,500 dollars a year that stays in the general fund permanently."]],tags:["off grid","dark sky compliant","no utility bill"]},{id:"b4",cat:"beyond",t:"Street tree canopy",k:"Seven thousand trees along forty miles of street, planted where people actually walk.",p:[-160,14,376],stem:14,stats:[["7,000","trees at full build"],["2,500","phase one"],["-5 to -8 F","under canopy"],["+5 to 15%","property value"]],rows:[["Density","One tree per thirty linear feet across forty miles. Phase one is 2,500 trees on the priority walking corridors."],["Species","Willow oak, sweetgum, disease resistant American elm, eastern redbud and serviceberry. All from in state nurseries, many propagated at the campus training yard."],["Measured benefit","Street temperature drops 5 to 8 F under canopy. Each tree captures roughly 48 pounds of CO2 and over a thousand gallons of rainfall a year."],["Care","Watering, mulching and replacement are funded for the first three years, which is when trees actually die if nobody is paying attention."]],tags:["7,000 trees","heat reduction","3 year establishment"]},{id:"b5",cat:"beyond",t:"Community water treatment plant",k:"Clean drinking water for about 5,000 people, and the backup supply when something goes wrong.",p:[264,18,394],stem:18,stats:[["0.5 MGD","capacity"],["99%+","PFAS removal"],["~5,000","people served"],["8","community kiosks"]],rows:[["Why","Many rural households here have no municipal water or receive water with elevated nitrates from agriculture, PFAS from industry, or iron and manganese from geology."],["Treatment","Sediment and activated carbon pre filtration, reverse osmosis membrane array, UV disinfection, then calcium and magnesium remineralization before distribution."],["Kiosks","Eight dispensing kiosks in low income housing areas at one to two cents a gallon. That ends the bottled water tax on the people who can least afford it."],["Emergency role","Powered entirely by campus solar and storage with zero grid draw, so the plant keeps running during an outage and the campus becomes the backup water supply."]],note:"Capital is roughly 2.34 million. Net annual cost after kiosk revenue is about 110 thousand.",tags:["reverse osmosis","PFAS","kiosks","outage resilient"]},{id:"b6",cat:"beyond",t:"Home solar and battery",k:"Zero upfront, 30 to 50 percent lower bills, and the system is yours after ten years.",p:[-300,14,420],stem:14,stats:[["300","homes phase one"],["$0","upfront to homeowner"],["30 to 50%","bill reduction"],["Yr 10","transfers to owner"]],rows:[["Offer","Fully subsidized rooftop solar plus battery on single family homes within three miles. Nothing out of pocket for the homeowner."],["Structure","A community solar entity owns the systems and sells power to the household at twenty percent below the utility rate. After ten years the system transfers to the homeowner free and clear."],["Battery","Backup power during outages, which is not a luxury for an elderly resident or anyone running medical equipment at home."],["Scale","300 homes at roughly 5 kW each is 1.5 MW of community solar and about 700 tons of CO2 avoided per year."]],tags:["no upfront cost","PPA","ownership transfer"]},{id:"b7",cat:"beyond",t:"Microtransit shuttle",k:"The keystone. Without a ride, every other program is harder to reach.",p:[26,14,404],stem:14,stats:[["4","electric vans"],["Free","for area residents"],["6am to 10pm","Mon to Sat"],["On demand","app or phone call"]],rows:[["Fleet","Four fifteen passenger electric vans, all wheelchair accessible, charged on campus solar."],["Service","On demand through the low income neighborhoods by app or phone call, with fixed stops at the grocery store, the clinic, the library and this campus."],["Fare","Free for residents in the service area, one dollar flat for visitors, and no fare evasion enforcement. It operates on trust."],["Why it matters","Rural areas here have almost no public transit. Transportation is the program that makes the other programs reachable."]],tags:["on demand","wheelchair accessible","free for residents"]},{id:"b8",cat:"beyond",t:"Underground utility lines",k:"Overhead lines fail in storms and blight the street. Bury them while the trench is open.",p:[-300,12,352],stem:12,stats:[["10 mi","target"],["97%","fewer storm outages"],["75%","FEMA cost share"],["30 to 35 yr","service life"]],rows:[["Scope","Eight to twelve miles of residential feeder line along the main corridor within a two mile radius."],["Method","Open trenching on residential streets and micro trenching through paved sections. All conduit is sized for a future broadband pull through."],["Economics","Roughly 1.5 million a mile. FEMA hazard mitigation covers up to 75 percent, so the net on a 15 million dollar project lands under 4 million."],["Result","Ninety seven percent fewer storm outages and a street that stops looking like an industrial corridor."]],tags:["FEMA HMGP","micro trenching","spare conduit"]},{id:"b9",cat:"beyond",t:"Childcare and family support",k:"Ten thousand seats at two to five dollars a day, open on the shifts people actually work.",p:[176,14,398],stem:14,stats:[["10,000","seats at full build"],["$2 to 5","per day"],["24 hr","operation"],["$35 to 55M","new taxable income"]],rows:[["Why","Childcare is the single biggest barrier to workforce participation for low income parents. The national average runs 35 to 75 dollars a day, which prices a full time job out of reach."],["Hours","Twenty four hour facilities co located with the campus, because data center operations run around the clock and so do the shifts."],["Priority","Campus employees and Dignity Village residents first, then the community on a sliding scale."],["Return","Each parent who can now work contributes roughly 35 to 55 thousand a year in taxable income. A thousand parents is 35 to 55 million a year in new local tax base against an 11 million dollar program."]],note:"This is the largest single line item in the off site budget and the one with the clearest return.",tags:["10,000 seats","24 hour","sliding scale"]}];var Wy=[{id:"h1",cat:"heritage",t:"Heritage promenade",k:"One marker for every cleanup we ran before there was a site to build on. Walking toward the water walks you forward through the history.",stats:[["TODO_FACT","cleanups to date"],["TODO_FACT","volunteers"],["TODO_FACT","lb recovered"],["1","marker left blank"]],rows:[["Why it is here","We were pulling things out of the water long before we had a site to build on. The cleanups did not stop when the campus started. They are the reason it looks like this."],["The markers",'Each plinth carries a year, a location, a volunteer count and a recovered weight. The last marker is undated and blank. It is captioned "next one".'],["Data needed","TODO_FACT: which cleanups, what years, where, roughly how many volunteers, and roughly how much material recovered. No figure goes on a public marker without measured data behind it."]],note:"The promenade runs along the dune crossover, so the walk from the campus to the beach is the walk through the record.",tags:["heritage","cleanups","TODO_FACT"]},{id:"h2",cat:"heritage",t:"Recovered-material sculpture",k:"An anchor piece at the dune crest, assembled from net, rope, plastic, buoys and metal taken out of the water.",stats:[["11 m","tall"],["TODO_FACT","total mass"],["4","source cleanups"],["Yes","lit at night"]],rows:[["What it is made of","Only recovered material. Nothing was bought to build it."],["Where it sits","At the crest of the dune crossover, visible from the beach and from the estuary overlook."],["Data needed","TODO_FACT: total mass and the source cleanup for each component."]],note:"This is the image people photograph, which is the point.",tags:["sculpture","recovered material","TODO_FACT"]},{id:"h3",cat:"heritage",t:"Living shoreline",k:"Oyster-bag sills, marsh-grass plugs and coir logs. No bulkhead and no riprap.",stats:[["0","m of bulkhead"],["680 m","of treated shoreline"],["3","sill types"],["Yes","self-maintaining"]],rows:[["Method","Oyster-bag sills break the wave energy, marsh plugs hold the sediment, coir logs buy the planting time to establish. The shoreline gains material instead of losing it."],["Why not a wall","A bulkhead reflects wave energy and scours the toe. Within a decade it needs a bigger wall. A living shoreline gets stronger."]],note:"The same principle as the berm: work with the load rather than against it.",tags:["oyster reef","marsh","no bulkhead"]},{id:"h4",cat:"heritage",t:"Ocean and beach cleanup",k:"A skimmer, two RIBs, a collection barge and a shore crew. The operation did not stop when the campus opened.",stats:[["TODO_FACT","cleanups per year"],["TODO_FACT","lb per cleanup"],["7","monitoring buoys"],["2","beach stretches compared"]],rows:[["On the water","A skimmer works a slow loop inside a debris boom, with two RIBs feeding it and a barge taking the load ashore."],["On the beach","The stretch east of the crossover is cleared by hand. The stretch west of it is left as found, so the difference is visible rather than claimed."],["Data needed","TODO_FACT: cadence, crew size and recovered weight per cleanup."]],note:"The uncleaned stretch is deliberate. It is the control.",tags:["cleanup","skimmer","before and after","TODO_FACT"]},{id:"h5",cat:"heritage",t:"Watershed corridor",k:"Campus stormwater to bioswale to creek to river to estuary to ocean. One continuous, walkable ribbon.",stats:[["150 mi","to the Atlantic"],["1.4 km","of trail"],["3","planting bands"],["1","monitoring station"]],rows:[["The continuum","Bennettsville sits in the Yadkin\u2013Pee Dee basin and the Great Pee Dee runs southeast into Winyah Bay and the Atlantic. Water that leaves this site ends up in that ocean."],["Shown compressed","The corridor here is a compressed model, not a map. A marker on the overlook says so."],["The works","A headwall and level spreader at the outfall, cobble check dams down the creek, three riparian planting bands, and a footbridge at the estuary head."]],note:"The reason the ocean belongs in this model is that the campus already drains to it.",tags:["Pee Dee","watershed","riparian"]},{id:"h6",cat:"heritage",t:"Then and now",k:"Three paired ma
